[project]
name = "longdrive"
version = "0.1.0"
description = "Generate long-form, slow-moving instrumental music from a text prompt on consumer hardware."
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "soundfile>=0.13",
]

[project.scripts]
longdrive = "longdrive.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/longdrive"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["engine: needs the real ACE-Step engine and a GPU (deselected by default)"]
addopts = "-m 'not engine'"

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
